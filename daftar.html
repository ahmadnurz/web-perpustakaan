<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Anggota - Perpustakaan Digital UNM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="navbar-container">
            <a href="index.html">Beranda</a>
            <a href="katalog.html">Katalog Buku</a>
            <a href="daftar.html" class="active">Daftar Anggota</a>
            <a href="info.html">Info Perpustakaan</a>
            <a href="kartuAnggota.html">Kartu Anggota</a>
        </div>
    </nav>
    <div class="container">
        <h2>Isi Data Diri Anda</h2>
        <form action="#" method="post" enctype="multipart/form-data">
            <p>
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama_lengkap" required>
            </p>
            <p>
                <label for="nim_nik">NIM / NIK:</label>
                <input type="number" id="nim_nik" name="nim_nik" required>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="tgl_lahir">Tanggal Lahir:</label>
                <input type="date" id="tgl_lahir" name="tanggal_lahir" required>
            </p>
            <p>
                <label for="nohp">No. HP:</label>
                <input type="tel" id="nohp" name="no_hp" required>
            </p>
            <p>
                <label for="alamat">Alamat:</label>
                <textarea id="alamat" name="alamat" rows="4" cols="50" required></textarea>
            </p>
            <p>
                <label>Jenis Keanggotaan:</label>
                <input type="radio" id="reguler" name="jenis_keanggotaan" value="Reguler">
                <label for="reguler">Reguler</label>
                <input type="radio" id="premium" name="jenis_keanggotaan" value="Premium">
                <label for="premium">Premium</label>
                <input type="radio" id="mahasiswa" name="jenis_keanggotaan" value="Mahasiswa" checked>
                <label for="mahasiswa">Mahasiswa</label>
            </p>
            <p>
                <label>Kategori Buku yang Diminati:</label>
                <input type="checkbox" id="pemrograman" name="minat_kategori[]" value="Pemrograman">
                <label for="pemrograman">Pemrograman</label>
                <input type="checkbox" id="jaringan" name="minat_kategori[]" value="Jaringan & Keamanan">
                <label for="jaringan">Jaringan & Keamanan</label>
                <input type="checkbox" id="ai" name="minat_kategori[]" value="Kecerdasan Buatan">
                <label for="ai">Kecerdasan Buatan</label>
            </p>
            <p>
                <label for="favorit">Kategori Buku Favorit Utama:</label>
                <select id="favorit" name="kategori_favorit">
                    <option value="Pemrograman">Pemrograman</option>
                    <option value="Jaringan & Keamanan">Jaringan & Keamanan</option>
                    <option value="Kecerdasan Buatan">Kecerdasan Buatan</option>
                </select>
            </p>
            <p>
                <label for="foto">Upload Foto Identitas:</label>
                <input type="file" id="foto" name="foto_identitas" required>
            </p>
            <p id="submit">
                <button type="reset">Reset</button>
                <button type="submit">Daftar</button>
            </p>
        </form>

</body>

</html>
